html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif;overflow:hidden}
header{padding:10px 12px 6px;background:var(--panel);border-bottom:2px dashed var(--line)}
h1{font-size:18px;margin:0 0 6px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input{flex:1;min-width:120px;border:2px solid var(--line);border-radius:999px;padding:7px 12px;font:inherit;background:transparent;color:var(--ink)}
button{font:inherit;color:var(--ink);border:2px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;cursor:pointer}
button.on{background:#ff8fab;border-color:#ff8fab;color:#fff}
#filters{display:none;padding-top:6px;max-height:38vh;overflow-y:auto}
#filters.open{display:block}
.grp{margin:4px 0}.grp b{font-size:12px;color:var(--soft);display:block;margin-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:5px;margin:2px 3px 2px 0;padding:3px 9px;font-size:13px}
.chip i{width:11px;height:11px;border-radius:50%;display:inline-block}
.chip.off{opacity:.35}
#wrap{flex:1;position:relative;min-height:0}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cnt{position:absolute;left:10px;top:8px;background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;border:2px solid var(--line)}
#card{position:absolute;left:10px;right:10px;bottom:10px;max-width:380px;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:12px 14px;display:none;font-size:14px;line-height:1.45}
#card h2{margin:0 0 4px;font-size:17px}#card .x{position:absolute;right:8px;top:6px}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;color:#4a3b5c;margin:0 3px 4px 0}
